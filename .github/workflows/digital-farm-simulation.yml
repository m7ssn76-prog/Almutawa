name: Digital Farm Synthetic Monitor

on:
  pull_request:
    paths:
      - 'simulations/virtual_field_rover/**'
      - '.github/workflows/digital-farm-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'simulations/virtual_field_rover/**'
      - '.github/workflows/digital-farm-simulation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: digital-farm-synthetic-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          check-latest: false
      - name: Compile
        run: python -m compileall -q simulations/virtual_field_rover
      - name: Unit tests
        working-directory: simulations/virtual_field_rover
        run: python -m unittest -v test_monitor.py
      - name: Bounded synthetic patrol
        working-directory: simulations/virtual_field_rover
        run: |
          rm -rf runtime
          python monitor.py --cycles 1200 --summary runtime/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/summary.json').read_text())
          assert s['simulation_only'] is True
          assert s['real_farm_connected'] is False
          assert s['evidence_chain']['valid'] is True
          assert s['asa_aoip_gateway']['valid'] is True
          assert s['asa_aoip_gateway']['external_connection'] is False
          assert sum(s['flexibility_modes'].values()) == s['cycles']
          assert s['protected_storage']['authorized_access_only'] is True
          assert s['protected_storage']['hazardous_materials_allowed'] is False
          assert s['openai_advisory']['external_call_made'] is False
          assert s['openai_advisory']['autonomous_physical_actuation'] is False
          print('Digital farm synthetic monitor: PASS')
          PY
