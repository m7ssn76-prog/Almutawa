name: Digital Environment Synthetic Monitor

on:
  pull_request:
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'simulations/digital_environment/**'
      - '.github/workflows/digital-farm-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'simulations/digital_environment/**'
      - '.github/workflows/digital-farm-simulation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: digital-environment-synthetic-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install governed API dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app simulations/virtual_field_rover simulations/digital_environment
      - name: Legacy Digital Farm tests
        working-directory: simulations/virtual_field_rover
        run: python -m unittest discover -v
      - name: Digital Environment platform tests
        working-directory: simulations/digital_environment
        run: python -m unittest discover -v
      - name: Run bounded multi-environment synthetic suite
        working-directory: simulations/digital_environment
        run: |
          rm -rf runtime
          python engine.py --cycles 500 --summary runtime/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/summary.json').read_text())
          required={'agriculture','warehouse','urban_green','industrial','software_system'}
          assert s['classification'] == 'Internal Test Only'
          assert s['simulation_only'] is True
          assert s['real_environment_connected'] is False
          assert s['environment_count'] >= 5
          assert required.issubset(set(s['environment_types']))
          assert s['all_evidence_valid'] is True
          assert s['external_connection'] is False
          for p in s['profiles']:
              assert p['real_environment_connected'] is False
              assert p['evidence_chain']['valid'] is True
              assert p['asa_aoip_gateway']['valid'] is True
              assert p['asa_aoip_gateway']['external_connection'] is False
          print('Digital Environment synthetic suite: PASS')
          PY
      - name: Start governed ASA/AOIP local API
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
          ASA_GATE_AVAILABLE: 'true'
          ASA_GATE_ELIGIBLE: 'true'
          ASA_GATE_AUTHORIZED: 'true'
          ASA_GATE_CONNECTED: 'true'
          ASA_GATE_EXECUTED: 'true'
          ASA_GATE_TESTED: 'true'
          ASA_GATE_EVIDENCED: 'true'
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/asa-aoip.log 2>&1 &
          echo $! > /tmp/asa-aoip.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(40):
              try:
                  with urlopen('http://127.0.0.1:8000/health', timeout=1) as r:
                      if r.status == 200:
                          print('ASA/AOIP local API: READY')
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('ASA/AOIP local API failed to become ready')
          PY
      - name: Bridge Digital Environment suite into ASA/AOIP
        working-directory: simulations/digital_environment
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: python asa_bridge.py runtime/summary.json
      - name: Verify governed Digital Environment knowledge record
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          token='synthetic-ci-token-00000000000000000000000000000001'
          req=Request(
              'http://127.0.0.1:8000/api/v1/knowledge?q=' + quote('Digital Environment Synthetic Monitoring Suite'),
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
          )
          with urlopen(req, timeout=5) as r:
              rows=json.loads(r.read().decode())
          assert rows, 'No Digital Environment record found in ASA/AOIP'
          row=rows[0]
          assert row['data_origin'] == 'synthetic'
          assert row['status'] == 'draft'
          assert row['sensitivity'] == 'public'
          assert len(row['provenance_hash']) == 64
          content=json.loads(row['content'])
          assert content['schema'] == 'asa.aoip.digital-environment-suite.v1'
          assert content['environment_count'] >= 5
          assert content['real_environment_connected'] is False
          assert content['boundary']['physical_actuation'] is False
          assert content['boundary']['person_tracking'] is False
          assert content['boundary']['covert_monitoring'] is False
          assert 'hidden_incidents' not in row['content']
          assert 'detected_incidents' not in row['content']
          print('Digital Environment -> ASA/AOIP governed bridge: PASS')
          PY
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/asa-aoip.pid ]; then kill "$(cat /tmp/asa-aoip.pid)" || true; fi
