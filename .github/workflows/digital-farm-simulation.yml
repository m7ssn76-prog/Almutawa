name: Digital Farm Synthetic Monitor

on:
  pull_request:
    paths:
      - 'simulations/virtual_field_rover/**'
      - '.github/workflows/digital-farm-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'simulations/virtual_field_rover/**'
      - '.github/workflows/digital-farm-simulation.yml'
  workflow_dispatch:
    inputs:
      verify_openai:
        description: 'Run one bounded OpenAI API connectivity check'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: digital-farm-synthetic-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install governed API dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app simulations/virtual_field_rover
      - name: Unit tests
        working-directory: simulations/virtual_field_rover
        run: python -m unittest discover -v
      - name: Bounded synthetic patrol
        working-directory: simulations/virtual_field_rover
        run: |
          rm -rf runtime
          python monitor.py --cycles 1200 --summary runtime/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/summary.json').read_text())
          assert s['simulation_only'] is True
          assert s['real_farm_connected'] is False
          assert s['evidence_chain']['valid'] is True
          assert s['asa_aoip_gateway']['valid'] is True
          assert s['asa_aoip_gateway']['external_connection'] is False
          print('Digital farm synthetic monitor: PASS')
          PY
      - name: Start governed ASA/AOIP local API
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
          ASA_GATE_AVAILABLE: 'true'
          ASA_GATE_ELIGIBLE: 'true'
          ASA_GATE_AUTHORIZED: 'true'
          ASA_GATE_CONNECTED: 'true'
          ASA_GATE_EXECUTED: 'true'
          ASA_GATE_TESTED: 'true'
          ASA_GATE_EVIDENCED: 'true'
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/asa-aoip.log 2>&1 &
          echo $! > /tmp/asa-aoip.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(40):
              try:
                  with urlopen('http://127.0.0.1:8000/health', timeout=1) as r:
                      if r.status == 200:
                          print('ASA/AOIP local API: READY')
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('ASA/AOIP local API failed to become ready')
          PY
      - name: Bridge digital farm evidence into ASA/AOIP
        working-directory: simulations/virtual_field_rover
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: python asa_bridge.py runtime/summary.json
      - name: Verify bridged knowledge record
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          token='synthetic-ci-token-00000000000000000000000000000001'
          req=Request(
              'http://127.0.0.1:8000/api/v1/knowledge?q=' + quote('Digital Farm Synthetic Monitoring Run'),
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
          )
          with urlopen(req, timeout=5) as r:
              rows=json.loads(r.read().decode())
          assert rows, 'No bridged ASA/AOIP record found'
          row=rows[0]
          assert row['data_origin'] == 'synthetic'
          assert row['status'] == 'draft'
          assert row['sensitivity'] == 'public'
          assert len(row['provenance_hash']) == 64
          assert 'real_farm_connected' in row['content']
          print('Digital Farm -> ASA/AOIP governed bridge: PASS')
          PY
      - name: Verify OpenAI API connectivity (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_openai }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASA_OPENAI_MODEL: gpt-5.6-sol
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get('OPENAI_API_KEY', '').strip()
          if not key:
              raise SystemExit('OPENAI_API_KEY GitHub Secret is not configured')

          body = json.dumps({
              'model': os.environ.get('ASA_OPENAI_MODEL', 'gpt-5.6-sol'),
              'input': 'Return exactly: OK',
              'max_output_tokens': 16,
              'store': False,
          }).encode('utf-8')
          req = Request(
              'https://api.openai.com/v1/responses',
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
              },
          )
          try:
              with urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  status = response.status
          except HTTPError as exc:
              detail = exc.read().decode('utf-8', errors='replace')[:1000]
              raise SystemExit(f'OpenAI API connectivity failed: HTTP {exc.code}: {detail}') from exc
          except URLError as exc:
              raise SystemExit('OpenAI API connectivity failed: network error') from exc

          if status != 200 or not payload.get('id'):
              raise SystemExit('OpenAI API connectivity failed: invalid response')
          print('OpenAI API bounded connectivity: PASS')
          print('model:', payload.get('model'))
          print('response_id_prefix:', str(payload.get('id'))[:12])
          PY
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/asa-aoip.pid ]; then kill "$(cat /tmp/asa-aoip.pid)" || true; fi
