name: Digital Environment & Interactive World Monitor

on:
  pull_request:
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'simulations/digital_environment/**'
      - 'simulations/interactive_digital_world/**'
      - '.github/workflows/digital-farm-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'simulations/digital_environment/**'
      - 'simulations/interactive_digital_world/**'
      - '.github/workflows/digital-farm-simulation.yml'
  workflow_dispatch:
    inputs:
      verify_openai:
        description: 'Run one bounded OpenAI API connectivity check'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: digital-environment-interactive-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install governed API dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app simulations/virtual_field_rover simulations/digital_environment simulations/interactive_digital_world
      - name: Legacy Digital Farm tests
        working-directory: simulations/virtual_field_rover
        run: python -m unittest discover -v
      - name: Digital Environment platform tests
        working-directory: simulations/digital_environment
        run: python -m unittest discover -v
      - name: Interactive Digital World tests
        working-directory: simulations/interactive_digital_world
        run: python -m unittest discover -v
      - name: Run bounded multi-environment synthetic suite
        working-directory: simulations/digital_environment
        run: |
          rm -rf runtime
          python engine.py --cycles 500 --summary runtime/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/summary.json').read_text())
          required={'agriculture','warehouse','urban_green','industrial','software_system'}
          assert s['classification'] == 'Internal Test Only'
          assert s['simulation_only'] is True
          assert s['real_environment_connected'] is False
          assert s['environment_count'] >= 5
          assert required.issubset(set(s['environment_types']))
          assert s['all_evidence_valid'] is True
          assert s['external_connection'] is False
          for p in s['profiles']:
              assert p['real_environment_connected'] is False
              assert p['evidence_chain']['valid'] is True
              assert p['asa_aoip_gateway']['valid'] is True
              assert p['asa_aoip_gateway']['external_connection'] is False
          print('Digital Environment synthetic suite: PASS')
          PY
      - name: Run interactive world causal scenario
        working-directory: simulations/interactive_digital_world
        run: |
          rm -rf runtime
          python world.py --ticks 90 --summary runtime/snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/snapshot.json').read_text())
          assert s['classification'] == 'Internal Test Only'
          assert s['simulation_only'] is True
          assert s['real_environment_connected'] is False
          assert s['physical_actuation'] is False
          assert s['rover']['light_on'] is True
          assert s['world']['irrigation_on'] is True
          assert s['clock_seconds'] == 90
          assert s['evidence_chain']['valid'] is True
          assert s['last_perception']['state'] in {'NORMAL','DEGRADED_NORMAL','ANOMALY_SUSPECTED','CONFIRMED_ANOMALY','EVIDENCE_CONFLICT'}
          print('Interactive Digital World causal scenario: PASS')
          PY
      - name: Start governed ASA/AOIP local API
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
          ASA_GATE_AVAILABLE: 'true'
          ASA_GATE_ELIGIBLE: 'true'
          ASA_GATE_AUTHORIZED: 'true'
          ASA_GATE_CONNECTED: 'true'
          ASA_GATE_EXECUTED: 'true'
          ASA_GATE_TESTED: 'true'
          ASA_GATE_EVIDENCED: 'true'
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/asa-aoip.log 2>&1 &
          echo $! > /tmp/asa-aoip.pid
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(40):
              try:
                  with urlopen('http://127.0.0.1:8000/health', timeout=1) as r:
                      if r.status == 200:
                          print('ASA/AOIP local API: READY')
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('ASA/AOIP local API failed to become ready')
          PY
      - name: Bridge Digital Environment suite into ASA/AOIP
        working-directory: simulations/digital_environment
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: python environment_bridge.py runtime/summary.json
      - name: Bridge Interactive Digital World into ASA/AOIP
        working-directory: simulations/interactive_digital_world
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: python interactive_bridge.py runtime/snapshot.json
      - name: Verify governed knowledge records
        env:
          ASA_API_BEARER_TOKEN: synthetic-ci-token-00000000000000000000000000000001
        run: |
          python - <<'PY'
          import json
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          token='synthetic-ci-token-00000000000000000000000000000001'
          def fetch(title):
              req=Request(
                  'http://127.0.0.1:8000/api/v1/knowledge?q=' + quote(title),
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
              )
              with urlopen(req, timeout=5) as r:
                  rows=json.loads(r.read().decode())
              assert rows, f'No governed record found for {title}'
              return rows[0]

          row=fetch('Digital Environment Synthetic Monitoring Suite')
          assert row['data_origin'] == 'synthetic'
          assert row['status'] == 'draft'
          assert row['sensitivity'] == 'public'
          assert len(row['provenance_hash']) == 64
          content=json.loads(row['content'])
          assert content['schema'] == 'asa.aoip.digital-environment-suite.v1'
          assert content['real_environment_connected'] is False
          assert content['boundary']['physical_actuation'] is False
          assert content['boundary']['person_tracking'] is False
          assert content['boundary']['covert_monitoring'] is False

          row=fetch('Interactive Digital World Snapshot')
          assert row['data_origin'] == 'synthetic'
          assert row['status'] == 'draft'
          assert row['sensitivity'] == 'public'
          assert len(row['provenance_hash']) == 64
          content=json.loads(row['content'])
          assert content['schema'] == 'asa.aoip.interactive-digital-world.v1'
          assert content['simulation_only'] is True
          assert content['real_environment_connected'] is False
          assert content['physical_actuation'] is False
          assert content['evidence_chain']['valid'] is True
          assert content['boundary']['person_tracking'] is False
          assert content['boundary']['covert_monitoring'] is False
          print('Digital Environment + Interactive World -> ASA/AOIP governed bridge: PASS')
          PY
      - name: Verify OpenAI API connectivity (bounded, explicit only)
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-openai]')) || (github.event_name == 'workflow_dispatch' && inputs.verify_openai) }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASA_OPENAI_MODEL: gpt-5.6-sol
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          key = os.environ.get('OPENAI_API_KEY', '').strip()
          if not key:
              raise SystemExit('OPENAI_API_KEY GitHub Secret is not configured')

          body = json.dumps({
              'model': os.environ.get('ASA_OPENAI_MODEL', 'gpt-5.6-sol'),
              'input': 'Return exactly: OK',
              'max_output_tokens': 16,
              'store': False,
          }).encode('utf-8')
          req = Request(
              'https://api.openai.com/v1/responses',
              data=body,
              method='POST',
              headers={
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
              },
          )
          try:
              with urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  status = response.status
          except HTTPError as exc:
              raise SystemExit(f'OpenAI API connectivity failed: HTTP {exc.code}') from exc
          except URLError as exc:
              raise SystemExit('OpenAI API connectivity failed: network error') from exc

          if status != 200 or not payload.get('id'):
              raise SystemExit('OpenAI API connectivity failed: invalid response')
          print('OpenAI API bounded connectivity: PASS')
          print('model:', payload.get('model'))
          print('response_id_prefix:', str(payload.get('id'))[:12])
          PY
      - name: Stop local API
        if: always()
        run: |
          if [ -f /tmp/asa-aoip.pid ]; then kill "$(cat /tmp/asa-aoip.pid)" || true; fi
