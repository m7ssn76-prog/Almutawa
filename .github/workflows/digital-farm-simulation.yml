name: Digital Farm Synthetic Monitor

on:
  pull_request:
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'app/smart_farm.py'
      - 'tests/test_smart_farm.py'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/digital-farm-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'simulations/virtual_field_rover/**'
      - 'app/smart_farm.py'
      - 'tests/test_smart_farm.py'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.github/workflows/digital-farm-simulation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: digital-farm-synthetic-monitor
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Smart Farm and synthetic rover
        run: python -m compileall -q app/smart_farm.py tests/test_smart_farm.py simulations/virtual_field_rover
      - name: Smart Farm API safety tests
        run: PYTHONPATH=. pytest -q tests/test_smart_farm.py
      - name: Synthetic rover unit tests
        working-directory: simulations/virtual_field_rover
        run: python -m unittest -v test_monitor.py
      - name: Bounded synthetic patrol
        working-directory: simulations/virtual_field_rover
        run: |
          rm -rf runtime
          python monitor.py --cycles 1200 --summary runtime/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('runtime/summary.json').read_text())
          assert s['simulation_only'] is True
          assert s['real_farm_connected'] is False
          assert s['evidence_chain']['valid'] is True
          assert s['asa_aoip_gateway']['valid'] is True
          assert s['asa_aoip_gateway']['external_connection'] is False
          print('Digital farm synthetic monitor: PASS')
          PY
