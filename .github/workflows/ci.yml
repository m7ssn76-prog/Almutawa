name: ci

on:
  push:
    branches: [main, agent/asa-aoip-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify mandatory governance and evidence-control files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            SECURITY.md \
            DATA_HANDLING.md \
            PUBLICATION_POLICY.md \
            .asa/audit-policy.json \
            .asa/activation-record-2026-08-09.json \
            .asa/verification-record-2026-08-09-0735.json; do
            test -s "$f"
          done
      - name: Verify audit status gate is not stale
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('.asa/audit-policy.json').read_text(encoding='utf-8'))
          expected_status = 'implemented_github_actions_verified_internal_test'
          if policy.get('status') != expected_status:
              raise SystemExit(f"Audit policy status must be {expected_status!r}")
          if policy.get('classification') != 'Internal Test Only':
              raise SystemExit('Audit classification must remain Internal Test Only')
          PY
      - name: Require immutable GitHub Action references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE '^[[:space:]]*uses:[[:space:]]+[^@[:space:]]+@v[0-9]+' .github/workflows; then
            echo 'Mutable major-version GitHub Action tags are forbidden; pin third-party actions to commit SHAs.'
            exit 1
          fi
      - name: Enforce repository privacy policy
        run: python scripts/repo_policy_check.py
      - name: Verify local-only container exposure controls
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^USER[[:space:]]+app$' Dockerfile
          grep -Fq '"127.0.0.1:8000:8000"' docker-compose.yml
          grep -Fq 'ASA_API_BEARER_TOKEN: ${ASA_API_BEARER_TOKEN:?' docker-compose.yml
          grep -Fq 'read_only: true' docker-compose.yml
          grep -Fq 'no-new-privileges:true' docker-compose.yml
          grep -Fq -- '- ALL' docker-compose.yml
          grep -Fq 'pids_limit: 128' docker-compose.yml
          grep -Fq '/tmp:rw,noexec,nosuid,size=16m' docker-compose.yml
          if grep -Eq 'pip[[:space:]]+install[[:space:]]+.*--upgrade[[:space:]]+pip' Dockerfile; then
            echo 'Unpinned pip self-upgrade is forbidden in the verification image.'
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r app scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Lint
        run: ruff check app tests scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Compile
        run: python -m compileall -q app tests scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Smart education self-test
        run: python smart_education_system.py
      - name: Education guard self-test
        run: python education_guard_engine.py
      - name: School gateway synthetic self-test
        run: python school_gateway.py
      - name: Verify generated evidence is not committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^asa-evidence/'; then
            echo 'Committed generated evidence is forbidden.'
            exit 1
          fi
      - name: Build local verification image
        run: docker build -t asa-aoip-knowledge-hub:test .
      - name: Run container end-to-end and verify SQLite persistence
        shell: bash
        run: |
          set -euo pipefail

          container_name="asa-ci-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume_name="asa-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$token"
          export ASA_TEST_TOKEN="$token"

          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            docker volume rm "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume_name" >/dev/null

          start_container() {
            docker run -d \
              --name "$container_name" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 128 \
              -p 127.0.0.1:8000:8000 \
              -e ASA_AOIP_DB_PATH=/data/asa_aoip.db \
              -e ASA_API_BEARER_TOKEN="$token" \
              -e ASA_GATE_AVAILABLE=true \
              -e ASA_GATE_ELIGIBLE=true \
              -e ASA_GATE_AUTHORIZED=true \
              -e ASA_GATE_CONNECTED=true \
              -e ASA_GATE_EXECUTED=true \
              -e ASA_GATE_TESTED=true \
              -e ASA_GATE_EVIDENCED=true \
              -v "$volume_name:/data" \
              asa-aoip-knowledge-hub:test >/dev/null
          }

          wait_for_health() {
            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health >/tmp/asa-health.json; then
                python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/asa-health.json').read_text(encoding='utf-8'))
          assert health == {
              'status': 'ok',
              'service': 'asa-aoip-knowledge-hub',
              'database': 'ok',
              'capability_gate': 'Operational',
          }, health
          PY
                return 0
              fi
              sleep 1
            done
            docker logs "$container_name" || true
            return 1
          }

          start_container
          wait_for_health

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = 'http://127.0.0.1:8000'
          token = os.environ['ASA_TEST_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
          }

          try:
              urllib.request.urlopen(base + '/api/v1/knowledge', timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          else:
              raise AssertionError('Unauthenticated API request unexpectedly succeeded')

          missing_approval = json.dumps({
              'title': 'Approval gate probe',
              'content': 'Synthetic low-sensitivity approval-path probe',
              'data_origin': 'approved_low_sensitivity',
              'sensitivity': 'internal',
          }).encode('utf-8')
          bad_request = urllib.request.Request(
              base + '/api/v1/knowledge',
              data=missing_approval,
              method='POST',
              headers=headers,
          )
          try:
              urllib.request.urlopen(bad_request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 422, exc.code
          else:
              raise AssertionError('Approved low-sensitivity data was accepted without approval reference')

          payload = json.dumps({
              'title': 'CI persistence probe',
              'content': 'Synthetic internal-test persistence record',
              'purpose': 'runtime_persistence_verification',
              'sensitivity': 'internal',
              'transformation_state': 'original',
              'data_origin': 'synthetic',
          }).encode('utf-8')
          request = urllib.request.Request(
              base + '/api/v1/knowledge',
              data=payload,
              method='POST',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 201
              created = json.load(response)
          assert len(created['provenance_hash']) == 64
          assert created['data_origin'] == 'synthetic'
          assert created['approval_reference'] is None
          Path('/tmp/asa-item-id').write_text(str(created['id']), encoding='utf-8')
          PY

          docker rm -f "$container_name" >/dev/null
          start_container
          wait_for_health

          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          item_id = Path('/tmp/asa-item-id').read_text(encoding='utf-8').strip()
          request = urllib.request.Request(
              f'http://127.0.0.1:8000/api/v1/knowledge/{item_id}',
              headers={'Authorization': f"Bearer {os.environ['ASA_TEST_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              assert response.status == 200
              persisted = json.load(response)
          assert persisted['title'] == 'CI persistence probe'
          assert persisted['purpose'] == 'runtime_persistence_verification'
          assert persisted['data_origin'] == 'synthetic'
          assert persisted['approval_reference'] is None
          PY

          echo 'Runtime HTTP, authentication, public-safe data-origin gating, CRUD write/read, container restart, SQLite persistence, read-only rootfs, capability drop, no-new-privileges, and PID limit verification passed.'
