name: ci

on:
  push:
    branches: [main, agent/asa-aoip-mvp]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Enforce repository privacy policy
        run: python scripts/repo_policy_check.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r app scripts
      - name: Lint
        run: ruff check app tests scripts
      - name: Compile
        run: python -m compileall -q app tests scripts
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Build local verification image
        run: docker build -t asa-aoip-knowledge-hub:test .
