name: ci

on:
  push:
    branches: [main, agent/asa-aoip-mvp, feature/smart-education-bullying-guard]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify mandatory governance and evidence-control files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            SECURITY.md \
            DATA_HANDLING.md \
            PUBLICATION_POLICY.md \
            .asa/audit-policy.json \
            .asa/activation-record-2026-08-09.json \
            .asa/verification-record-2026-08-09-0735.json; do
            test -s "$f"
          done
      - name: Enforce repository privacy policy
        run: python scripts/repo_policy_check.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -q -r app scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Lint
        run: ruff check app tests scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Compile
        run: python -m compileall -q app tests scripts smart_education_system.py education_guard_engine.py school_gateway.py
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Smart education self-test
        run: python smart_education_system.py
      - name: Education guard self-test
        run: python education_guard_engine.py
      - name: School gateway synthetic self-test
        run: python school_gateway.py
      - name: External HTTPS synthetic connectivity smoke test
        run: python school_gateway.py --live-smoke
      - name: Verify generated evidence is not committed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^asa-evidence/'; then
            echo 'Committed generated evidence is forbidden.'
            exit 1
          fi
      - name: Build local verification image
        run: docker build -t asa-aoip-knowledge-hub:test .
